name: Install ddv

on:
  push:
    branches:
      - '*'
    paths:
      - ddv.rb
      - .github/workflows/install-ddv.yml

jobs:
  install:
    strategy:
      matrix:
        targets:
          - ubuntu-26.04 # x86_64
          - macos-26-intel # x86_64
          - macos-26 # aarch64
    runs-on: ${{ matrix.targets }}
    steps:
      - name: Setup homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master
      - name: Run brew install
        run: brew install lusingander/tap/ddv
      - name: Test
        run: ddv --version
