name: Install lpx

on:
  push:
    branches:
      - '*'
    paths:
      - lpx.rb
      - .github/workflows/install-lpx.yml

jobs:
  install:
    strategy:
      matrix:
        targets:
          - macos-26-intel # x86_64
          - macos-26 # aarch64
    runs-on: ${{ matrix.targets }}
    steps:
      - name: Run brew install
        run: brew install lusingander/tap/lpx
      - name: Test
        run: lpx --version
