name: Install sauva

on:
  push:
    branches:
      - '*'
    paths:
      - sauva.rb
      - .github/workflows/install-sauva.yml

jobs:
  install:
    strategy:
      matrix:
        targets:
          - ubuntu-26.04 # x86_64
          - macos-26-intel # x86_64
          - macos-26 # aarch64
    runs-on: ${{ matrix.targets }}
    steps:
      - name: Setup homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@2026.11.09.1
      - name: Run brew install
        run: brew install lusingander/tap/sauva
      - name: Test
        run: sauva --version
