name: Install serie

on:
  push:
    branches:
      - '*'
    paths:
      - serie.rb
      - .github/workflows/install-serie.yml

jobs:
  install:
    strategy:
      matrix:
        targets:
          - ubuntu-26.04 # x86_64
          - macos-26-intel # x86_64
          - macos-26 # aarch64
    runs-on: ${{ matrix.targets }}
    steps:
      - name: Setup homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master
      - name: Run brew install
        run: brew install lusingander/tap/serie
      - name: Test
        run: serie --version
