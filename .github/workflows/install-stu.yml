name: Install stu

on:
  push:
    branches:
      - '*'
    paths:
      - stu.rb
      - .github/workflows/install-stu.yml

jobs:
  install:
    strategy:
      matrix:
        targets:
          - ubuntu-26.04 # x86_64
          - macos-26-intel # x86_64
          - macos-26 # aarch64
    runs-on: ${{ matrix.targets }}
    steps:
      # https://github.com/actions/runner-images/issues/6283
      - name: Setup homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@2026.11.09.1
      - name: Run brew install
        run: brew install lusingander/tap/stu
      - name: Test
        run: stu --version
